# 호스트 시험 + 펌웨어 빌드. 기기는 필요 없다.
#
# 보안(공개 저장소라고 가정하고 짠다):
#   - 권한은 읽기뿐이다(permissions: contents: read). 비밀 값(secrets)을 쓰지 않는다 — 누구의 PR 이 돌아도 잃을 것이 없다.
#   - pull_request 로만 돈다. pull_request_target 은 쓰지 않는다(PR 의 코드가 저장소의 권한으로 돌게 된다).
#   - 남의 액션은 꼬리표(v4)가 아니라 커밋 번호로 고정한다 — 꼬리표는 주인이 다른 커밋으로 옮길 수 있다.
#     새 판은 .github/dependabot.yml 이 알려 준다. 컨테이너 그림을 쓰는 일은 그 그림도 지문(sha256)으로 고정한다.
#   - 내려받은 저장소에 토큰을 남기지 않는다(persist-credentials: false).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: host tests (StickC — input/link, screen, loop)
        run: test/host/run.sh
  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install platformio==6.1.19
      - name: build (no upload)
        run: pio run -e stickc
