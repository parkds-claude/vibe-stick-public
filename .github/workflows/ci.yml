# 호스트 시험 + 펌웨어 빌드. 기기는 필요 없다.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: host tests (input/link, screen, loop)
        run: test/host/run.sh
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio==6.1.19
      - name: build (no upload)
        run: pio run -e stickc
