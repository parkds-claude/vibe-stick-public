; vibe-stick — M5StickC Plus + Mini JoyC HAT 블루투스 말하기 버튼
; D7: 같은 기기로 먼저 검증해 둔 조합(ESP32-PICO-D4 / 4MB / PSRAM 없음)을 그대로 쓴다.
;   - 이유: 실물에서 이미 동작이 확인됨
;   - 비용: OTA 영역 없음(huge_app) → 펌웨어 갱신은 USB 로만
;   - 탈출구: 다른 기기로 옮길 때 [env] 를 하나 더 추가
[env:stickc]
; 플랫폼은 6.x 에 묶는다: 최신(arduino-esp32 3.x)에서는 이 보드 정의가 깨진다.
; 정확한 버전에 고정(빌드·검토한 값). ^6.7.0 이면 6.x 후속판으로 떠서 재현이 흔들린다.
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
; 올리기가 중간에 실패하면 아래 줄 맨 앞의 ; 를 지워 속도를 낮춘다(보드 기본은 1500000).
; 460800 은 이 기기(CH9102)·맥북 조합에서 통신이 끊긴다(실측) → 115200 으로.
; upload_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
; D16: CPU 160MHz. 같은 기기용으로 공개된 다른 펌웨어(claude-desktop-buddy)가 쓰는 값과 같다.
;   - 이유: 보드 기본 240MHz 는 이 용도에 과하고 배터리(120mAh)를 빨리 쓴다
;   - 비용: 없음(10ms 주기 처리에 여유 충분)
;   - 탈출구: 이 줄을 지우면 240MHz
board_build.f_cpu = 160000000L
; 라이브러리는 빌드·검토한 버전에 정확히 고정한다(기본값이 바뀌는 것을 막는다).
lib_deps =
    m5stack/M5Unified@0.2.25
    h2zero/NimBLE-Arduino@2.5.1

; 진단 로그가 켜진 빌드(블루투스 사건·화면 그리는 시간·남은 메모리, 조이스틱 값). 동작은 같다.
;   pio run -e stickc-debug -t upload --upload-port <PORT>
[env:stickc-debug]
extends = env:stickc
build_flags = -DDEBUG_LINK=1 -DDEBUG_JOY=1
